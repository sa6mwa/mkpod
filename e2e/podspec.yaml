    - uid: 1
      title: Switching to English
      pubDate: Sat, 30 Aug 2025 22:47:56 +0000
      link: https://qzj.se/audio/qzj029-english
      duration: "00:13:33"
      author: SA6MWA
      subtitle: QZJ expands scope, now in English with a sharper focus on modern defense, comms, and the systems behind them.
      description: |-
        This episode is about the evolution of Quebec Zulu Juliett as it shifts from Swedish to English and broadens its scope within the C4ISR domain — Command, Control, Communications, Computers, Intelligence, Surveillance, and Reconnaissance.

        Host Mike (SA6MWA) reflects on why he’s making the change, critiques Sweden’s defense posture and procurement system, and previews future topics such as:

        - Terrain-tactical HF radio communication (the Zenith Concept)
        - The shortcomings of traditional defense acquisition models
        - Agile frameworks applied to mission command
        - Radio communication in contested environments
        - The crossover between IT, defense, and resistance and resilience planning
        - Survival and outdoor life

        He also shares his background in cybersecurity and naval systems, thoughts on Cassandra syndrome and prediction backlash, and why folding his *Everything As Code* podcast into **QZJ** just makes sense.

        If you're interested in modern defense communication, decentralized command philosophies, or how AI and software are reshaping military systems, this episode sets the stage for everything that’s coming next.

        Contact Mike at [sa6mwa@gmail.com](mailto:sa6mwa@gmail.com).

        ### Links
